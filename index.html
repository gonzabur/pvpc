<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precio de la luz hoy y mañana (PVPC)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f5b301'/%3E%3Cpath d='M18 4 8 18h7l-2 10 11-15h-7z' fill='%23222'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --fg: #1b1f24; --muted: #5d6673; --line: #dde1e7;
  --barato: #2e9e5b; --medio: #e0a100; --caro: #d6403a; --now: #1b1f24;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171b; --card: #1e2227; --fg: #eceff3; --muted: #9aa4b2; --line: #333a43;
    --barato: #3fbf75; --medio: #e8b422; --caro: #ef5f58; --now: #fff;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.3rem; margin: 0 0 12px; }
h2 { font-size: 1.1rem; margin: 0 0 8px; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.now { font-size: clamp(1.9rem, 9vw, 2.8rem); font-weight: 700; margin: 0; }
.muted { color: var(--muted); font-size: .9rem; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0; }
.dot { display: inline-block; width: .8em; height: .8em; border-radius: 50%; margin-right: 4px; }
ol.bars { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
ol.bars li { display: grid; grid-template-columns: 2.2em 1fr 6.6em; gap: 6px; align-items: center; padding: 2px 4px; border-radius: 6px; font-size: .85rem; }
ol.bars li.now-row { outline: 2px solid var(--now); background: color-mix(in srgb, var(--now) 8%, transparent); font-weight: 700; }
.track { height: 14px; }
.bar { height: 100%; border-radius: 3px; min-width: 2px; }
.barato { background: var(--barato); } .medio { background: var(--medio); } .caro { background: var(--caro); }
.val { text-align: right; white-space: nowrap; }
.tag { display: block; font-size: .75rem; font-weight: 700; grid-column: 2 / 4; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 12px 0 0; }
dt { color: var(--muted); } dd { margin: 0; font-weight: 600; }
h3 { font-size: .95rem; margin: 12px 0 4px; }
ul.top3 { margin: 0; padding-left: 1.2em; }
#estado { text-align: center; }
button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
footer { text-align: center; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Precio de la luz (PVPC)</h1>
  <p id="sim" class="muted" hidden></p>
  <section id="estado" aria-live="polite">
    <p id="msg">Cargando precios…</p>
    <button id="retry" hidden>Reintentar</button>
  </section>
  <section id="hoy" hidden></section>
  <section id="manana" hidden></section>
  <footer class="muted">
    <p>Datos: REE (apidatos.ree.es) · Actualizado: <span id="updated">—</span> · <span id="version"></span></p>
  </footer>
</main>
<script type="module">
import { VERSION, madridNow, addDays, isValidDate, buildUrl, parse, currentIndex, stats, level, fmt, fmtNum } from './pvpc.js';

const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
};
const hh = (e) => `${e.hour}:00`;
const LABEL = { barato: 'barato', medio: 'medio', caro: 'caro' };

const fecha = new URLSearchParams(location.search).get('fecha');
const sim = isValidDate(fecha) ? fecha : null;  // ?fecha=AAAA-MM-DD: simulación con esa fecha como "hoy"
let data = null;          // { today, tomorrow }
let loadedDate = null;    // fecha de Madrid con la que se cargó
let lastFetch = 0;
let lastIdx = -1;         // índice de la hora vigente en el último render
let loading = false;

function dayBlock(title, day, nowIdx, approx) {
  const s = stats(day);
  const f = (p) => (approx ? '≈ ' : '') + fmt(p);
  const n = (p) => (approx ? '≈ ' : '') + fmtNum(p);
  const frag = document.createDocumentFragment();
  frag.append(el('h2', title));
  if (nowIdx >= 0) {
    frag.append(el('p', 'Precio ahora (' + hh(day[nowIdx]) + ')', 'muted'));
    frag.append(el('p', f(day[nowIdx].price), 'now'));
  }
  const legend = el('div', null, 'legend muted');
  for (const k of ['barato', 'medio', 'caro']) {
    const l = el('span', LABEL[k]);
    const d = el('span', null, 'dot ' + k);
    l.prepend(d);
    legend.append(l);
  }
  frag.append(legend);

  const ol = el('ol', null, 'bars');
  day.forEach((e, i) => {
    const lv = level(e.price, s);
    const li = el('li', null, i === nowIdx ? 'now-row' : '');
    const track = el('div', null, 'track');
    const bar = el('div', null, 'bar ' + lv);
    bar.style.width = Math.min(100, Math.max(0, s.max > 0 ? e.price / s.max * 100 : 0)) + '%';
    track.append(bar);
    li.append(el('span', e.hour), track, el('span', n(e.price), 'val'));
    if (i === nowIdx) li.append(el('span', '◀ ahora', 'tag'));
    if (i === s.minI) li.append(el('span', '▼ más barata', 'tag'));
    if (i === s.maxI) li.append(el('span', '▲ más cara', 'tag'));
    li.title = `${hh(e)}: ${f(e.price)} (${lv})`;
    ol.append(li);
  });
  frag.append(ol);

  const dl = el('dl');
  dl.append(el('dt', 'Mínimo'), el('dd', `${f(s.min)} · ${hh(day[s.minI])}`));
  dl.append(el('dt', 'Máximo'), el('dd', `${f(s.max)} · ${hh(day[s.maxI])}`));
  dl.append(el('dt', 'Media'), el('dd', f(s.avg)));
  frag.append(dl, el('h3', '3 horas más baratas'));
  const ul = el('ul', null, 'top3');
  for (const i of s.cheapest) ul.append(el('li', `${hh(day[i])} · ${f(day[i].price)}`));
  frag.append(ul);
  return frag;
}

function render() {
  const now = new Date();
  lastIdx = currentIndex(data.today, now.getTime());
  $('estado').hidden = true;
  const hoy = $('hoy');
  hoy.replaceChildren(dayBlock('Hoy', data.today, lastIdx));
  hoy.hidden = false;
  const man = $('manana');
  const oficial = data.tomorrow.length > 0;
  const dia = oficial ? data.tomorrow : data.estimate;
  if (dia.length) {
    man.replaceChildren(dayBlock(oficial ? 'Mañana' : 'Mañana · estimación', dia, -1, !oficial));
    if (!oficial) man.firstChild.after(el('p', 'Estimación a partir del mercado mayorista. Orienta sobre las horas baratas y caras; el precio exacto puede variar. Los precios oficiales se publican sobre las 20:15.', 'muted'));
  } else {
    man.replaceChildren(el('h2', 'Mañana'), el('p', 'Los precios de mañana se publican sobre las 20:15'));
  }
  man.hidden = false;
}

async function load() {
  if (loading) return;
  loading = true;
  const date = sim ?? madridNow().date;
  if (!data) {
    $('estado').hidden = false;
    $('retry').hidden = true;
    $('msg').textContent = 'Cargando precios…';
  }
  try {
    const tomorrow = addDays(date, 1);
    const res = await fetch(buildUrl(addDays(tomorrow, -7), tomorrow), { signal: AbortSignal.timeout(15000) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = parse(await res.json(), date, tomorrow);
    loadedDate = date;
    lastFetch = Date.now();
    $('updated').textContent = new Date().toLocaleTimeString('es-ES', { timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit' }) + ' (hora de Madrid)';
    render();
  } catch (err) {
    if (data) { $('estado').hidden = true; lastFetch = Date.now(); return; }  // datos ya en pantalla: se reintenta más tarde
    $('estado').hidden = false;
    $('msg').textContent = 'No se pudieron cargar los precios (' + err.message + ').';
    $('retry').hidden = false;
  } finally {
    loading = false;
  }
}

$('version').textContent = 'v' + VERSION;
if (sim) {
  const [y, m, d] = sim.split('-');
  const a = el('a', 'Volver a hoy');
  a.href = './';
  $('sim').append(`Simulación: datos del ${d}/${m}/${y} · `, a);
  $('sim').hidden = false;
}
$('retry').onclick = load;
load();

if (!sim) setInterval(() => {
  const { date, hour } = madridNow();
  if (date !== loadedDate) { data = null; $('hoy').hidden = $('manana').hidden = true; load(); }
  else if (!data) return;
  else if (!data.tomorrow.length && Date.now() - lastFetch >= 10 * 60e3 && (hour >= 20 || (hour >= 13 && !data.estimate.length))) load();
  else if (currentIndex(data.today, Date.now()) !== lastIdx) render();
}, 30e3);
</script>
</body>
</html>
