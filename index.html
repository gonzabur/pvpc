<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precio de la luz hoy y mañana (PVPC)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f5b301'/%3E%3Cpath d='M18 4 8 18h7l-2 10 11-15h-7z' fill='%23222'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --fg: #1b1f24; --muted: #5d6673; --line: #dde1e7;
  --barato: #2e9e5b; --medio: #e0a100; --caro: #d6403a; --now: #1b1f24;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171b; --card: #1e2227; --fg: #eceff3; --muted: #9aa4b2; --line: #333a43;
    --barato: #3fbf75; --medio: #e8b422; --caro: #ef5f58; --now: #fff;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
main { max-width: 1000px; margin: 0 auto; padding: 12px 10px; }
h1 { font-size: 1.2rem; margin: 0 0 10px; }
h2 { font-size: 1rem; margin: 0; }
p { margin: 0; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; }
.muted { color: var(--muted); font-size: .75rem; }
.barato { --c: var(--barato); } .medio { --c: var(--medio); } .caro { --c: var(--caro); }
.hero { margin-bottom: 8px; padding: 12px; }
.hero .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.now { font-size: clamp(1.8rem, 9vw, 2.6rem); font-weight: 700; line-height: 1.2; }
.badge { border: 1px solid var(--c, var(--muted)); border-radius: 999px; padding: 0 6px; font-size: .6875rem; font-weight: 700; white-space: nowrap; }
.hero .badge { border-width: 2px; font-size: 1rem; padding: 1px 12px; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-items: start; }
.title { display: flex; align-items: center; gap: 6px; height: 24px; }
.sum { margin: 6px 0 8px; font-size: .75rem; }
.stat { display: flex; justify-content: space-between; gap: 4px; height: 18px; white-space: nowrap; }
ol.bars { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; --vw: 3.8em; }
ol.bars.approx { --vw: 5em; }
ol.bars li { display: grid; grid-template-columns: 2.5em minmax(0, 1fr) var(--vw); gap: 6px; align-items: center; height: 22px; padding: 0 2px; border-radius: 6px; font-size: .75rem; white-space: nowrap; }
ol.bars li.now-row { outline: 2px solid var(--now); outline-offset: -2px; background: color-mix(in srgb, var(--now) 8%, transparent); }
.track { height: 12px; }
.bar { height: 100%; border-radius: 3px; min-width: 2px; background: var(--c); }
.val { text-align: right; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 8px 0 4px; }
.dot { display: inline-block; width: .8em; height: .8em; border-radius: 50%; margin-right: 4px; background: var(--c); }
#estado { text-align: center; padding: 16px; }
button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
footer { text-align: center; margin-top: 12px; }
[hidden] { display: none !important; }
@media (min-width: 700px) {
  main { padding: 20px 16px; }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.3rem; }
  section { padding: 16px; }
  .muted, .sum, ol.bars li { font-size: .9rem; }
  .badge { font-size: .75rem; }
  .hero { margin-bottom: 16px; }
  .cards { gap: 16px; }
  .sum { margin: 8px 0 12px; }
  .stat { height: 22px; }
  ol.bars li { height: 28px; gap: 10px; }
  .track { height: 16px; }
}
</style>
</head>
<body>
<main>
  <h1>Precio de la luz (PVPC)</h1>
  <p id="sim" class="muted" hidden></p>
  <section id="estado" aria-live="polite">
    <p id="msg">Cargando precios…</p>
    <button id="retry" hidden>Reintentar</button>
  </section>
  <div id="panel" hidden>
    <section id="ahora" class="hero" hidden></section>
    <div class="cards">
      <section id="hoy"></section>
      <section id="manana"></section>
    </div>
    <p class="legend muted">
      <span><i class="dot barato"></i>barato</span><span><i class="dot medio"></i>medio</span><span><i class="dot caro"></i>caro</span>
      <span>▼ más barata</span><span>▲ más cara</span>
    </p>
    <p id="nota" class="muted" hidden>Estimación a partir del mercado mayorista. Orienta sobre las horas baratas y caras; el precio exacto puede variar. Los precios oficiales se publican sobre las 20:15.</p>
  </div>
  <footer class="muted">
    <p>Datos: REE (apidatos.ree.es) · Actualizado: <span id="updated">—</span> · <span id="version"></span></p>
  </footer>
</main>
<script type="module">
import { VERSION, madridNow, addDays, isValidDate, buildUrl, parse, currentIndex, stats, level, fmt, fmtNum, fmtDate } from './pvpc.js';

const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
};
const fecha = new URLSearchParams(location.search).get('fecha');
const sim = isValidDate(fecha) ? fecha : null;  // ?fecha=AAAA-MM-DD: simulación con esa fecha como "hoy"
let data = null;          // { today, tomorrow, estimate }
let loadedDate = null;    // fecha de Madrid con la que se cargó
let lastFetch = 0;
let lastIdx = -1;         // índice de la hora vigente en el último render
let loading = false;

// Tarjeta de un día: cabecera, resumen y una fila fija por hora. approx: precios estimados ("≈ ").
function dayBlock(title, date, day, nowIdx, approx) {
  const frag = document.createDocumentFragment();
  const head = el('div', null, 'title');
  head.append(el('h2', title));
  if (approx) head.append(el('span', 'estimación', 'badge'));
  frag.append(head, el('p', fmtDate(date) + (day.length ? ' · €/kWh' : ''), 'muted'));
  if (!day.length) {
    frag.append(el('p', 'Los precios de mañana se publican sobre las 20:15'));
    return frag;
  }

  const s = stats(day);
  const n = (p) => (approx ? '≈ ' : '') + fmtNum(p);
  const stat = (label, value) => {
    const d = el('div', null, 'stat');
    d.append(el('span', label), el('b', value));
    return d;
  };
  const sum = el('div', null, 'sum');
  sum.append(
    stat('Media', n(s.avg)),
    stat('Más barata', `${day[s.minI].hour}h ${n(s.min)}`),
    stat('Más cara', `${day[s.maxI].hour}h ${n(s.max)}`),
  );

  const ol = el('ol', null, approx ? 'bars approx' : 'bars');
  day.forEach((e, i) => {
    const lv = level(e.price, s);
    const li = el('li', null, i === nowIdx ? 'now-row' : '');
    const track = el('div', null, 'track');
    const bar = el('div', null, 'bar ' + lv);
    bar.style.width = Math.min(100, Math.max(0, s.max > 0 ? e.price / s.max * 100 : 0)) + '%';
    track.append(bar);
    li.append(el('span', e.hour + (i === s.minI ? '▼' : i === s.maxI ? '▲' : '')), track, el('span', n(e.price), 'val'));
    li.title = `${e.hour}:00: ${n(e.price)} €/kWh (${lv})`;
    ol.append(li);
  });
  frag.append(sum, ol);
  return frag;
}

function render() {
  const now = new Date();
  lastIdx = currentIndex(data.today, now.getTime());
  $('estado').hidden = true;
  const hero = $('ahora');
  hero.hidden = lastIdx < 0;
  if (lastIdx >= 0) {
    const e = data.today[lastIdx];
    const lv = level(e.price, stats(data.today));
    const row = el('div', null, 'row');
    row.append(el('p', fmt(e.price), 'now'), el('span', lv[0].toUpperCase() + lv.slice(1), 'badge ' + lv));
    hero.replaceChildren(el('p', `Ahora · ${Number(e.hour)}–${Number(e.hour) + 1} h`, 'muted'), row);
  }
  const oficial = data.tomorrow.length > 0;
  const dia = oficial ? data.tomorrow : data.estimate;
  $('hoy').replaceChildren(dayBlock('Hoy', loadedDate, data.today, lastIdx));
  $('manana').replaceChildren(dayBlock('Mañana', addDays(loadedDate, 1), dia, -1, !oficial && dia.length > 0));
  $('nota').hidden = oficial || !dia.length;
  $('panel').hidden = false;
}

async function load() {
  if (loading) return;
  loading = true;
  const date = sim ?? madridNow().date;
  if (!data) {
    $('estado').hidden = false;
    $('retry').hidden = true;
    $('msg').textContent = 'Cargando precios…';
  }
  try {
    const tomorrow = addDays(date, 1);
    const res = await fetch(buildUrl(addDays(tomorrow, -7), tomorrow), { signal: AbortSignal.timeout(15000) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = parse(await res.json(), date, tomorrow);
    loadedDate = date;
    lastFetch = Date.now();
    $('updated').textContent = new Date().toLocaleTimeString('es-ES', { timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit' }) + ' (hora de Madrid)';
    render();
  } catch (err) {
    if (data) { $('estado').hidden = true; lastFetch = Date.now(); return; }  // datos ya en pantalla: se reintenta más tarde
    $('estado').hidden = false;
    $('msg').textContent = 'No se pudieron cargar los precios (' + err.message + ').';
    $('retry').hidden = false;
  } finally {
    loading = false;
  }
}

$('version').textContent = 'v' + VERSION;
if (sim) {
  const [y, m, d] = sim.split('-');
  const a = el('a', 'Volver a hoy');
  a.href = './';
  $('sim').append(`Simulación: datos del ${d}/${m}/${y} · `, a);
  $('sim').hidden = false;
}
$('retry').onclick = load;
load();

if (!sim) setInterval(() => {
  const { date, hour } = madridNow();
  if (date !== loadedDate) { data = null; $('panel').hidden = true; load(); }
  else if (!data) return;
  else if (!data.tomorrow.length && Date.now() - lastFetch >= 10 * 60e3 && (hour >= 20 || (hour >= 13 && !data.estimate.length))) load();
  else if (currentIndex(data.today, Date.now()) !== lastIdx) render();
}, 30e3);
</script>
</body>
</html>
